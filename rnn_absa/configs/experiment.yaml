experiment:
  name: rnn_absa_hotel_malang
  seeds: [42, 123, 456]

data:
  processed_dir: ../data/processed
  aspects:
    - kebersihan
    - pelayanan
    - fasilitas
    - lokasi
    - harga
    - kenyamanan_kamar
  overall_aspect: overall_sentiment
  labels:
    - positive
    - negative
    - neutral

embedding:
  type: fasttext
  path: embeddings/cc.id.300.bin
  dim: 300
  freeze: true

models:
  - rnn
  - lstm
  - gru
  - birnn
  - bilstm
  - bigru

hyperparameters:
  hidden_size: 256
  num_layers: 2
  dropout: 0.2
  learning_rate: 1.0e-4
  batch_size: 32
  max_epochs: 100
  early_stopping_patience: 10
  max_seq_len: 128

evaluation:
  primary_metric: macro_f1
  splits: [validation, test]
